services:
  mihomo:
    image: metacubex/mihomo:latest
    pull_policy: always
    container_name: ${CONTAINER_NAME}
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - ${PANEL_APP_PORT_HTTP}:7890
      - ${CONTROLLER_PORT}:9090
    networks:
      - 1panel-network
    volumes:
      - ${CONFIG_PATH}:/root/.config/mihomo
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
