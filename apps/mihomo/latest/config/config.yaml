# Mihomo (Clash.Meta) 默认基础配置文件
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

# RESTful Web API 控制器配置
external-controller: 0.0.0.0:9090
secret: ""

# 允许跨域请求（方便通过 Zashboard / Yacd 等前端 Web 面板访问）
cors:
  allow-origins:
    - '*'
  allow-private-network: true

# ==========================================
# 方式 A: 通过订阅链接自动导入与定时更新 (推荐)
# 将下方 url 中的链接替换为您的机场订阅地址即可
# ==========================================
proxy-providers:
  my-provider:
    type: http
    url: "https://your-airport-subscription-url.com" # 👈 填入您的订阅链接
    interval: 86400  # 自动更新间隔(秒)，默认 24 小时
    path: ./proxy_providers/provider.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204

# 策略组配置
proxy-groups:
  - name: PROXY
    type: select
    use:
      - my-provider # 自动加载上方订阅链接中的所有节点
    proxies:
      - DIRECT

  - name: AUTO
    type: url-test
    use:
      - my-provider
    url: https://www.gstatic.com/generate_204
    interval: 300

# 基础路由分流规则
rules:
  - MATCH,PROXY
