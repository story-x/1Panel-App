services:
  metapi:
    image: 1467078763/metapi:1.3.0
    pull_policy: always
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - ${PANEL_APP_PORT_HTTP}:4000
    networks:
      - 1panel-network
    volumes:
      - ./data:/app/data
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN}
      PROXY_TOKEN: ${PROXY_TOKEN}
      CHECKIN_CRON: ${CHECKIN_CRON}
      BALANCE_REFRESH_CRON: ${BALANCE_REFRESH_CRON}
      PORT: 4000
      DATA_DIR: /app/data
      TZ: ${TZ}
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
