networks:
    1panel-network:
        external: true

services:
    gsuid-core:
        image: python:3.13-slim
        container_name: ${CONTAINER_NAME}
        restart: always
        ports:
            - ${PANEL_APP_PORT_HTTP}:8765
        networks:
            - 1panel-network
        volumes:
            # 挂载应用代码和数据目录
            - ${CODE_DIR}:/app
            # 挂载时区文件
            - /etc/localtime:/etc/localtime:ro
            - /etc/timezone:/etc/timezone:ro
        hostname: ${CONTAINER_NAME:-gsuid-core}
        environment:
            - PYTHONUNBUFFERED=1
            - TZ=Asia/Shanghai
            - APP_NAME=GsCore
            - APP_KEY=gscore
            - INSTALL_OPENCV=${INSTALL_OPENCV:-true}
        working_dir: /app
        # 启动命令
        command: ${START_COMMAND}
        labels:
            createdBy: "Apps"
            app: "gscore"
            app.name: "GsCore"
            app.title: "早柚核心 (GsCore)"
            app.description: "多平台游戏查询 Bot 核心框架"
